version: '3.8'

services:
  app:
    container_name: dev-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "pnpm install && pnpm --filter app dev"

volumes:
  node_modules:
